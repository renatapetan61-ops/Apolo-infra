name: APOLO INFRA — Control Plane CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    name: Type-check Vercel control plane
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript check
        run: npm run lint

  worker:
    name: Validate Codespaces worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check worker syntax
        run: |
          node --check agent.mjs
          node --check integration-test.mjs

  podman-nginx-worker-integration:
    name: Real Podman + Nginx worker lifecycle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Podman and Nginx
        run: |
          sudo apt-get update
          sudo apt-get install -y podman fuse-overlayfs nginx curl zip unzip
      - name: Run real worker integration test
        working-directory: apps/worker
        run: node integration-test.mjs
