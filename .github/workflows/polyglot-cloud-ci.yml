name: APOLO Polyglot Cloud CI

on:
  pull_request:
    paths:
      - "examples/polyglot-cloud/**"
      - ".github/workflows/polyglot-cloud-ci.yml"
  push:
    branches: [main]
    paths:
      - "examples/polyglot-cloud/**"
      - ".github/workflows/polyglot-cloud-ci.yml"

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build multi-language container
        run: docker build --pull -t apolo-polyglot-cloud:ci examples/polyglot-cloud
      - name: Start container
        run: docker run -d --name apolo-polyglot-cloud -p 18080:8080 apolo-polyglot-cloud:ci
      - name: Wait for gateway health
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18080/healthz; then
              exit 0
            fi
            sleep 2
          done
          docker logs apolo-polyglot-cloud
          exit 1
      - name: Verify all language routes
        run: |
          set -eu
          for route in rust python go ruby; do
            body="$(curl --fail --silent "http://127.0.0.1:18080/$route")"
            echo "$body"
            echo "$body" | grep -qi "\"service\":\"$route\""
          done
      - name: Container logs on failure
        if: failure()
        run: docker logs apolo-polyglot-cloud
      - name: Cleanup
        if: always()
        run: docker rm -f apolo-polyglot-cloud || true
