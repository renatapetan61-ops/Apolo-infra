name: APOLO INFRA — Daemon CI

on:
  push:
    branches: [main]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/daemon-ci.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test daemon (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.23.x', '1.24.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - name: Resolve dependencies and checksums
        run: go mod tidy
      - name: Format Go sources
        run: gofmt -w $(find . -name '*.go' -type f)
      - name: Run tests
        run: go test -race -cover ./...
      - name: Build daemon
        run: mkdir -p dist && go build -trimpath -ldflags='-s -w' -o dist/apolo-infra-daemon ./cmd/apolo-infra-daemon

  docker-deploy-smoke:
    name: Real Docker deployment smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Docker Engine
        run: docker info
      - name: Build, start and HTTP-check sample application
        run: bash scripts/test-docker-deploy.sh

  podman-deploy-smoke:
    name: Real Podman deployment smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman fuse-overlayfs
      - name: Verify Podman engine
        run: podman info
      - name: Build, start and HTTP-check sample application
        env:
          CONTAINER_ENGINE: podman
        run: bash scripts/test-podman-deploy.sh

  mkcert-host-trust:
    name: mkcert host trust integration test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Install mkcert and host trust dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3-tools openssl
          go install filippo.io/mkcert@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Install local CA and verify host trust
        run: |
          export CAROOT="$HOME/.local/share/mkcert"
          mkdir -p "$CAROOT"
          sudo env CAROOT="$CAROOT" "$(go env GOPATH)/bin/mkcert" -install
          CAROOT="$CAROOT" MKCERT_SKIP_INSTALL=1 bash scripts/test-mkcert-host-trust.sh
          APOLO_RUN_MKCERT_INTEGRATION=1 go test ./internal/tls -run TestMkcertHostTrustIntegration -v
          APOLO_RUN_MKCERT_INTEGRATION=1 go test ./internal/api -run TestInfrastructureHTTPSLifecycleWithMkcert -v
