name: APOLO INFRA — Daemon CI

on:
  push:
    branches: [main]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/daemon-ci.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test daemon (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.23.x', '1.24.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - name: Resolve dependencies and checksums
        run: go mod tidy
      - name: Format Go sources
        run: gofmt -w $(find . -name '*.go' -type f)
      - name: Run tests
        run: go test -race -cover ./...
      - name: Build daemon
        run: mkdir -p dist && go build -trimpath -ldflags='-s -w' -o dist/apolo-infra-daemon ./cmd/apolo-infra-daemon

  docker-deploy-smoke:
    name: Real Docker deployment smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Docker Engine
        run: docker info
      - name: Build, start and HTTP-check sample application
        run: bash scripts/test-docker-deploy.sh
